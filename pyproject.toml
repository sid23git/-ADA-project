[project]
name = "ada"
version = "4.0.0"
description = "An auditable multi-agent AI data-science team: a lead agent, parallel tool-using specialists, a skeptical critic and code-verified, evidence-cited reports."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Precision loss occurred:RuntimeWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E402",   # matplotlib.use('Agg') must run before pyplot is imported
    "B905",   # zip(strict=) adds noise where lengths are equal by construction
    "UP007",  # Optional[X] is kept for readability alongside the pydantic models
    "UP045",
    "UP042",  # (str, Enum) kept deliberately: StrEnum changes str() output the UI relies on
]
